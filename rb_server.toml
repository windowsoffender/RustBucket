# RustBucket server configuration.
#
# Values here override the built-in defaults. CLI flags override this file.
# Run with `--config <file>` to use a different file.

host = "0.0.0.0"
port = 6666
verbose = false
# SQLite database for sessions, tasks and results. Empty string keeps state in memory only.
db_path = "rustbucket.sqlite"

[mtls]
# Require a client certificate on the operator channel.
# The CA key is generated once and reused, so issued operator profiles stay valid across restarts.
enabled = true
ca_path = "certs/ca-cert.pem"
ca_key_path = "certs/ca-key.pem"
cert_path = "certs/client-cert.pem"
key_path = "certs/client-key.pem"
crl_path = "certs/crl.der"
crl_update_seconds = 5
