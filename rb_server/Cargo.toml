[package]
name = "rb_server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.10.2"
log = "0.4.26"
rand = "0.9.0"
serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
simple_logger = "5.0.0"
tokio = { version = "1.44.1", features = ["full"]}
uuid = { version = "1.16.0", features = ["v4", "serde"]}
rb = { path = "../rb" }
tokio-util = "0.7.14"
futures = "0.3.31"
clap = { version = "4.5.36", features = ["derive"] }
rustls = { version = "0.23.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2.1.1"
rcgen = "0.13.2"
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "0.8"
env_logger = "0.11.7"
dashmap = "6.1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
time = "0.3.55"
